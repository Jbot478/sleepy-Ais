<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sleepy Ais: Stay Awake!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="game-title">
        <h1>🍿 Sleepy Ais: Stay Awake!</h1>
        <p>Tap to keep Ais awake through the movie.</p>
      </header>

      <section id="openingScene" class="card">
        <h2>Opening Scene</h2>
        <figure class="opening-image-wrap">
          <img
            class="opening-image"
            src="friends-on-couch.svg"
            alt="John, Saz, Ais, and Katie sitting together on a couch for movie night"
          />
        </figure>
        <button id="introAdvanceBtn" class="dialogue-box" type="button">
          <p id="introDialogueLine"></p>
          <p id="introHint" class="dialogue-hint">Tap to continue…</p>
        </button>
        <button id="startBtn" class="btn btn-primary hidden">🎬 Start Movie Challenge</button>
      </section>

      <section id="gameScene" class="card hidden" aria-live="polite">
        <div class="hud">
          <span id="timeLabel">Time Left: 5:00</span>
          <span id="statusLabel">Status: Wide awake 👀</span>
        </div>
        <div id="gameArea" class="game-area" role="button" tabindex="0" aria-label="Tap game area to keep Ais awake">
          <div id="player" class="player" aria-hidden="true">👁️</div>
        </div>
        <p class="help">Tap anywhere in the game area to keep Ais floating through snacks and sleepy traps.</p>
      </section>

      <section id="resultScene" class="card hidden" aria-live="polite">
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>
        <button id="retryBtn" class="btn">🔁 Try Again</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
